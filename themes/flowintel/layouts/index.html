{{ define "main" }}
<section class="hero">
    <div class="hero-logo">
        <img src="{{ .Site.Params.logo | relURL }}" alt="{{ .Site.Title }}">
    </div>
    <p class="hero-tagline">{{ .Site.Params.description }}</p>
    <div class="hero-actions">
        <a class="btn btn-primary" href="{{ "docs/installation/" | relURL }}"><i class="fa-solid fa-rocket"></i> Getting started</a>
        {{ with .Site.Params.github }}<a class="btn btn-outline" href="{{ . }}" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i> GitHub</a>{{ end }}
        {{ range first 2 .Site.Params.manuals }}
        <a class="btn btn-outline" href="{{ .url }}" target="_blank" rel="noopener"><i class="{{ .icon }}"></i> {{ .name }}</a>
        {{ end }}
    </div>
</section>

<article class="doc-page">
    <div class="doc-body">
        {{ .Content }}
    </div>
</article>
{{ end }}
